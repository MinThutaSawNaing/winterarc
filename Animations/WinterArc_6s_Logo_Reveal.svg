<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="wordClip">
      <rect x="570" y="390" width="1080" height="165" rx="8"/>
    </clipPath>

    <style>
      <![CDATA[
        .hud-line {
          stroke:#fff;
          stroke-width:2;
          fill:none;
          opacity:0;
          stroke-dasharray:14 12;
          animation:hudIn .9s ease-out .15s forwards, hudPulse 2.8s ease-in-out 2s infinite;
        }

        .hud-thin {
          stroke:#fff;
          stroke-width:1.5;
          fill:none;
          opacity:0;
          stroke-dasharray:600;
          stroke-dashoffset:600;
          animation:draw 1.3s ease-out .25s forwards, fadeToSoft .5s ease-out 1.4s forwards;
        }

        .ring {
          stroke:#fff;
          fill:none;
          opacity:0;
          stroke-dasharray:1500;
          stroke-dashoffset:1500;
          animation:draw 1.6s ease-out .4s forwards, ringFade .7s ease-out 1.6s forwards;
          transform-origin:420px 495px;
        }

        .ring.r2 { animation-delay:.55s,1.8s; }
        .ring.r3 { animation-delay:.7s,1.95s; }

        .flake-stroke {
          stroke:#fff;
          stroke-width:18;
          stroke-linecap:square;
          stroke-linejoin:miter;
          fill:none;
          stroke-dasharray:1800;
          stroke-dashoffset:1800;
          filter:url(#softGlow);
          animation:draw 1.5s cubic-bezier(.22,.8,.2,1) .75s forwards;
        }

        .flake-core {
          opacity:0;
          transform-origin:420px 495px;
          transform:scale(.82);
          animation:pop .45s cubic-bezier(.15,.9,.25,1.3) 1.95s forwards;
          filter:url(#glow);
        }

        .mainword {
          opacity:0;
          transform:translateX(-34px);
          animation:wordIn .7s cubic-bezier(.2,.85,.25,1) 2.15s forwards;
        }

        .subword {
          opacity:0;
          letter-spacing:22px;
          animation:subIn .8s ease-out 2.9s forwards;
        }

        .tagline {
          opacity:0;
          animation:fadeUp .75s ease-out 3.55s forwards;
        }

        .micro {
          opacity:0;
          animation:fadeIn .7s ease-out 1.5s forwards;
        }

        .sweep {
          transform:translateX(-1200px);
          animation:sweepMove .9s ease-in-out 2.55s forwards;
          mix-blend-mode:screen;
        }

        .impact {
          opacity:0;
          animation:impact .45s ease-out 3.05s forwards;
        }

        .endhold {
          opacity:0;
          animation:endHold 1.1s ease-out 4.0s forwards;
        }

        @keyframes draw {
          to { stroke-dashoffset:0; opacity:1; }
        }

        @keyframes fadeToSoft {
          to { opacity:.25; }
        }

        @keyframes ringFade {
          to { opacity:.32; }
        }

        @keyframes pop {
          0% { opacity:0; transform:scale(.82); }
          70% { opacity:1; transform:scale(1.04); }
          100% { opacity:1; transform:scale(1); }
        }

        @keyframes wordIn {
          from { opacity:0; transform:translateX(-34px); filter:blur(6px); }
          to { opacity:1; transform:translateX(0); filter:blur(0); }
        }

        @keyframes subIn {
          from { opacity:0; letter-spacing:34px; }
          to { opacity:1; letter-spacing:18px; }
        }

        @keyframes fadeUp {
          from { opacity:0; transform:translateY(10px); }
          to { opacity:.9; transform:translateY(0); }
        }

        @keyframes fadeIn {
          to { opacity:.68; }
        }

        @keyframes hudIn {
          to { opacity:.22; }
        }

        @keyframes hudPulse {
          0%,100% { opacity:.16; }
          50% { opacity:.34; }
        }

        @keyframes sweepMove {
          0% { transform:translateX(-1200px); opacity:0; }
          10% { opacity:1; }
          100% { transform:translateX(1650px); opacity:0; }
        }

        @keyframes impact {
          0% { opacity:0; r:0; }
          35% { opacity:.9; }
          100% { opacity:0; r:160; }
        }

        @keyframes endHold {
          to { opacity:1; }
        }
      ]]>
    </style>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#000"/>

  <!-- Subtle technical frame -->
  <g>
    <path class="hud-thin" d="M58 84 H350 L390 124 H540"/>
    <path class="hud-thin" d="M1862 84 H1570 L1530 124 H1380"/>
    <path class="hud-thin" d="M58 996 H350 L390 956 H540"/>
    <path class="hud-thin" d="M1862 996 H1570 L1530 956 H1380"/>

    <path class="hud-line" d="M80 540 H260"/>
    <path class="hud-line" d="M1660 540 H1840"/>
    <path class="hud-line" d="M960 50 V180"/>
    <path class="hud-line" d="M960 900 V1030"/>
  </g>

  <!-- HUD rings -->
  <g transform="translate(0 0)">
    <circle class="ring r1" cx="420" cy="495" r="190" stroke-width="2.5"/>
    <circle class="ring r2" cx="420" cy="495" r="225" stroke-width="1.8" stroke-dasharray="12 10"/>
    <circle class="ring r3" cx="420" cy="495" r="255" stroke-width="1.2" stroke-dasharray="3 12"/>
    <path class="hud-thin" d="M420 205 V785"/>
    <path class="hud-thin" d="M130 495 H710"/>
  </g>

  <!-- Snowflake drawn as vector branches -->
  <g class="flake-stroke">
    <!-- vertical -->
    <path d="M420 315 V675"/>
    <path d="M420 365 L370 415"/>
    <path d="M420 365 L470 415"/>
    <path d="M420 625 L370 575"/>
    <path d="M420 625 L470 575"/>

    <!-- horizontal -->
    <path d="M240 495 H600"/>
    <path d="M290 495 L340 445"/>
    <path d="M290 495 L340 545"/>
    <path d="M550 495 L500 445"/>
    <path d="M550 495 L500 545"/>

    <!-- diag 1 -->
    <path d="M292 367 L548 623"/>
    <path d="M327 402 L327 472"/>
    <path d="M327 402 L397 402"/>
    <path d="M513 588 L513 518"/>
    <path d="M513 588 L443 588"/>

    <!-- diag 2 -->
    <path d="M548 367 L292 623"/>
    <path d="M513 402 L443 402"/>
    <path d="M513 402 L513 472"/>
    <path d="M327 588 L397 588"/>
    <path d="M327 588 L327 518"/>
  </g>

  <!-- Snowflake center impact -->
  <g class="flake-core">
    <circle cx="420" cy="495" r="18" fill="#fff"/>
    <circle cx="420" cy="495" r="70" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  </g>

  <!-- Main wordmark -->
  <g class="mainword" font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="575" y="485" font-size="138" font-weight="800" letter-spacing="6">WINTER ARC</text>
  </g>

  <!-- Moving light sweep -->
  <g clip-path="url(#wordClip)">
    <rect class="sweep" x="520" y="340" width="480" height="270" fill="url(#sweep)" opacity=".9"/>
  </g>

  <!-- Subtitle -->
  <text class="subword"
        x="582" y="595"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="400"
        fill="#fff">SOFTWARE SOLUTIONS</text>

  <!-- Tagline -->
  <text class="tagline"
        x="585" y="675"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="300"
        letter-spacing="6"
        fill="#fff">Software engineered for the future.</text>

  <!-- Micro HUD copy -->
  <g class="micro" fill="#fff" font-family="Arial, Helvetica, sans-serif">
    <text x="118" y="166" font-size="17" letter-spacing="5">PEOPLE</text>
    <text x="118" y="194" font-size="17" letter-spacing="5">TECHNOLOGY</text>
    <text x="118" y="222" font-size="17" letter-spacing="5">A SAFER</text>
    <text x="118" y="250" font-size="17" letter-spacing="5">TOMORROW</text>

    <text x="1535" y="166" font-size="17" letter-spacing="5">IDEAS</text>
    <text x="1535" y="194" font-size="17" letter-spacing="5">SYSTEMS</text>
    <text x="1535" y="222" font-size="17" letter-spacing="5">SOLUTIONS</text>
    <text x="1535" y="250" font-size="17" letter-spacing="5">BEYOND</text>

    <text x="118" y="860" font-size="16" letter-spacing="4">DISCOVER / BUILD / DEPLOY</text>
    <text x="1470" y="860" font-size="16" letter-spacing="4">BUILT FOR WHAT COMES NEXT</text>
  </g>

  <!-- Tiny particles -->
  <g fill="#fff" opacity=".6">
    <circle cx="980" cy="215" r="2"/>
    <circle cx="1160" cy="305" r="1.8"/>
    <circle cx="1325" cy="705" r="2.4"/>
    <circle cx="1480" cy="625" r="1.4"/>
    <circle cx="735" cy="790" r="1.6"/>
    <circle cx="840" cy="280" r="1.3"/>
    <circle cx="1030" cy="765" r="1.5"/>
    <circle cx="1595" cy="410" r="1.8"/>
  </g>

  <!-- Impact flash -->
  <circle class="impact" cx="420" cy="495" r="0" fill="none" stroke="#fff" stroke-width="4"/>

  <!-- Final settle line -->
  <g class="endhold">
    <line x1="585" y1="720" x2="1460" y2="720" stroke="#fff" stroke-opacity=".2"/>
    <rect x="1455" y="716" width="10" height="10" fill="#fff" opacity=".7"/>
  </g>
</svg>
